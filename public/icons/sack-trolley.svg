<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<title>Sack trolley</title>
<!-- A fruit machine on a sack trolley, side on, tilted back on its wheel, facing
     right (mirrored). Proportions from real cabinets (median 1724 tall x 641 deep):
     cabinet ~2.7x taller than deep, deck at ~55% height; trolley frame
     ~1200 (70% of the cabinet), wheel ~250 dia (15%).
     Drawn upright and rotated about the wheel's axle; one colour
     (currentColor) so it can sit on any background. -->
<g fill="currentColor" transform="matrix(-1 0 0 1 128 0) translate(64 64) scale(0.98) translate(-81.8 -57.2) rotate(20 86 108.5)">
  <!-- cabinet: no top box; reel glass raked back, the button deck jutting out,
       the lower door, and the back flat against the frame -->
  <path d="M74 106 V10 Q74 8 72 8 H58 Q56 8 56 10 L46 50 L38 53 V59 H42 V106 Z"/>
  <!-- frame and handle: shorter than the machine -->
  <path d="M78 112 V50 Q78 42 86 42 H90" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- toe plate -->
  <rect x="36" y="108" width="44" height="4" rx="1"/>
  <!-- axle bracket -->
  <path d="M78 100 L84 105 L78 110 Z"/>
  <!-- wheel, hub cut out -->
  <path fill-rule="evenodd" d="M86 101.5 A7 7 0 0 1 86 115.5 A7 7 0 0 1 86 101.5 Z M86 106.2 A2.3 2.3 0 0 0 86 110.8 A2.3 2.3 0 0 0 86 106.2 Z"/>
</g>
</svg>
